# ==============================================================================
#  CONFIGURACIÓN – SISTEMA DE ASISTENCIA PRORRIDRE PUNO
# ==============================================================================
#
#  IMPORTANTE: las credenciales ZKBio Time NUNCA van aquí.
#  Se leen desde las variables de entorno ZK_USER y ZK_PASS.
#  Si alguna falta, la aplicación falla al arrancar con mensaje claro.
# ==============================================================================

# ------------------------------------------------------------------------------
# Servidor de aplicación
# ------------------------------------------------------------------------------
server.port=8080
# Codificación UTF-8 en todas las respuestas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ------------------------------------------------------------------------------
# Zona horaria de la aplicación
# Los punch_time de ZKBio Time son hora local sin zona horaria;
# se interpretan siempre como America/Lima.
# ------------------------------------------------------------------------------
app.zona-horaria=America/Lima

# ------------------------------------------------------------------------------
# ZKBio Time – conexión (configurable sin recompilar)
# ------------------------------------------------------------------------------
zkbio.url=http://192.168.1.101:8085
zkbio.usuario=${ZK_USER:admin}
zkbio.clave=${ZK_PASS:prorridre2026}
# Tiempo de espera en milisegundos para las peticiones HTTP al reloj
zkbio.timeout-ms=15000
# Tamaño de página al paginar marcaciones (máximo que acepta ZKBio Time)
zkbio.page-size=1000

# ------------------------------------------------------------------------------
# Lector programado de marcaciones
# ------------------------------------------------------------------------------
# Período de consulta en milisegundos (20 000 ms = 20 s)
app.lector.periodo-ms=20000
# Para la primera consulta, cuántos días hacia atrás mirar
# (protege contra un reloj vacío o una BD nueva)
app.lector.dias-atras-inicial=1

# ------------------------------------------------------------------------------
# Base de datos H2 en archivo
# El archivo se guarda en el directorio de trabajo (donde se ejecuta el JAR).
# Para migrar a PostgreSQL: cambia las tres líneas de datasource y el driver.
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./datos/asistencia;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# "update" crea las tablas si no existen y añade columnas nuevas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 (solo para desarrollo; deshabilitar en producción)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga de datos iniciales (estados de marcación)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# Ejecutar data.sql después de que Hibernate cree/actualice las tablas.
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# Logging
# Nunca loguear usuario ni clave. El nivel INFO muestra el flujo normal.
# ------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.pe.gob.prorridre=INFO
logging.level.org.springframework.scheduling=INFO
